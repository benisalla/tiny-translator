[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "en_2_ar_translator"
version = "0.1.0"
description = "English-to-Arabic neural machine translation with a compact, readable Transformer built from scratch in PyTorch. Works for any language pair: BPE tokenizer, training, beam search, BLEU/chrF evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ismail Ben Alla" }]
keywords = [
  "machine-translation", "neural-machine-translation", "nmt", "translation", "transformer",
  "encoder-decoder", "seq2seq", "attention", "pytorch", "from-scratch", "arabic", "english-arabic",
  "bpe", "tokenizer", "beam-search", "label-smoothing", "sacrebleu", "nlp", "deep-learning",
]
dependencies = [
  "torch>=2.2",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
data = ["datasets>=2.16"]
eval = ["sacrebleu>=2.3"]
dev = ["pytest>=8", "ruff>=0.9", "sacrebleu>=2.3"]

[project.scripts]
en2ar-prepare = "en_2_ar_translator.prepare:main"
en2ar-train = "en_2_ar_translator.train:main"
en2ar-translate = "en_2_ar_translator.translate:main"
en2ar-evaluate = "en_2_ar_translator.evaluate:main"
en2ar-average = "en_2_ar_translator.average:main"

[tool.hatch.build.targets.wheel]
packages = ["src/en_2_ar_translator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip() lengths are checked explicitly where it matters
